name: Bug
description: Something behaves wrongly
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: What you observed — output, timings, traces. Measured, not guessed. }
    validations: { required: true }
  - type: textarea
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    attributes: { label: How to reproduce }
  - type: textarea
    attributes: { label: Cause, description: Leave empty unless measured. Say "unknown" and what measurement would settle it. }
